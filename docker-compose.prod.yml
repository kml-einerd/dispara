services:
  api:
    image: dispara-prod:latest
    restart: unless-stopped
    network_mode: "host"
    env_file: .env
    environment:
      - REDIS_URL=redis://127.0.0.1:6379
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: dispara-prod:latest
    restart: unless-stopped
    command: ["node", "workers/dispatch-worker/dist/worker.js"]
    network_mode: "host"
    env_file: .env
    environment:
      - REDIS_URL=redis://127.0.0.1:6379
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api

volumes:
  redis_data:
  certbot_www:
