name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx turbo run lint --filter='./apps/*' --filter='./packages/*' --filter='./workers/*'

      - run: npx turbo run build

      - run: npx turbo run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST || 'postgresql://localhost:5432/dispara_test' }}
